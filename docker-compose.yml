services:
  wordpress:
    image: wordpress:php8.2-apache
    container_name: starter-kit-wordpress
    restart: unless-stopped
    ports:
      - "8086:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: starter_user
      WORDPRESS_DB_PASSWORD: starter_password
      WORDPRESS_DB_NAME: starter_db
      WORDPRESS_TABLE_PREFIX: wp_
      WP_DEBUG: "true"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: starter-kit-mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: starter_db
      MYSQL_USER: starter_user
      MYSQL_PASSWORD: starter_password
      MYSQL_ROOT_PASSWORD: starter_root_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: starter-kit-phpmyadmin
    restart: unless-stopped
    ports:
      - "8087:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit:latest
    container_name: starter-kit-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  wp-cli:
    image: wordpress:cli-php8.2
    container_name: starter-kit-wpcli
    volumes:
      - .:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: starter_user
      WORDPRESS_DB_PASSWORD: starter_password
      WORDPRESS_DB_NAME: starter_db
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["wp"]

volumes:
  db_data:
